name: Android APK Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Modré Zóny Praha APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode debug.keystore from base64
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ModreZonyPraha.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModreZonyPraha-apk
          path: ModreZonyPraha.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: "Modré Zóny Praha – APK ke stažení (Android & Android Auto)"
          body: |
            Automaticky sestavený instalační balíček **ModreZonyPraha.apk** pro Android a Android Auto.
            Projekt portálu **Dotekomanie.cz** (https://dotekomanie.cz).
          files: |
            ModreZonyPraha.apk
            apk/ModreZonyPraha.apk
        continue-on-error: true
